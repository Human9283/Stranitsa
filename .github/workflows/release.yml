# Выпуск: git tag v1.2.3 && git push --tags → APK и установщики для Windows, macOS, Linux
# в GitHub Releases. Приложения сами находят новый выпуск (если репозиторий публичный).
#
# Название выпуска — «Страница <тег>», описание — из .github/release-notes/<тег>.md
# (нет файла — GitHub соберёт список изменений сам).
#
# Секреты репозитория для подписи APK (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — base64 от keystore/release.jks
#   ANDROID_KEYSTORE_PROPERTIES — содержимое keystore/keystore.properties
name: release
on:
  push:
    tags: ["v*", "[0-9]*"]
  # Выпуск без командной строки: Actions → release → Run workflow → тег (например v1.0.2).
  # Если такого тега ещё нет, он создаётся на последнем коммите выбранной ветки.
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег выпуска, например v1.0.2 (нет — создам; есть — пересоберу)"
        required: true
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        env:
          RAW: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="$RAW"
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Тег должен выглядеть как v1.2.3"; exit 1; }
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  android:
    needs: prepare
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Android SDK
        run: |
          # SDK уже есть на образе; action android-actions/setup-android на нём падает.
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KS" ] && [ -n "$PROPS" ]; then
            mkdir -p keystore
            echo "$KS" | base64 -d > keystore/release.jks
            printf '%s\n' "$PROPS" > keystore/keystore.properties
          else
            echo "::warning::Секреты ANDROID_KEYSTORE_* не заданы — APK будет без подписи и не установится на телефон."
          fi
      - name: Build
        run: |
          V="${TAG#v}"; V="${V%%-*}"   # 1.2.3-beta → 1.2.3: версии — только числа
          ./gradlew assembleRelease -PappVersion="$V" -PupdateRepo="$GITHUB_REPOSITORY"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in
            *unsigned*) cp "$APK" "Stranitsa-$V-unsigned.apk" ;;
            *)          cp "$APK" "Stranitsa-$V.apk" ;;
          esac
      - name: Release notes
        id: notes
        shell: bash
        run: |
          F=".github/release-notes/v${TAG#v}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; echo "generate=false" >> "$GITHUB_OUTPUT"
          else echo "path=" >> "$GITHUB_OUTPUT"; echo "generate=true" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Страница ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: Stranitsa-*.apk

  desktop:
    needs: prepare
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          V="${TAG#v}"; V="${V%%-*}"   # установщики принимают только числовую версию
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Свой установщик (Inno Setup): значок на рабочем столе, русский язык, проверка установки.
            pwsh installer/build.ps1 -Version "$V"
          else
            ./gradlew packageReleaseDistributionForCurrentOS -PappVersion="$V" -PupdateRepo="$GITHUB_REPOSITORY"
          fi
      - name: Release notes
        id: notes
        shell: bash
        run: |
          F=".github/release-notes/v${TAG#v}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; echo "generate=false" >> "$GITHUB_OUTPUT"
          else echo "path=" >> "$GITHUB_OUTPUT"; echo "generate=true" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Страница ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            desktop/build/compose/binaries/main-release/*/*.deb
            desktop/build/compose/binaries/main-release/*/*.rpm
            desktop/build/installer/*.exe
            desktop/build/compose/binaries/main-release/*/*.dmg
          fail_on_unmatched_files: false
