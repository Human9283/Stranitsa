# Выпуск: git tag v1.2.3 && git push --tags → APK и установщики для Windows, macOS, Linux
# в GitHub Releases. Приложения сами находят новый выпуск (если репозиторий публичный).
#
# Название выпуска — «Страница <тег>», описание — из .github/release-notes/<тег>.md
# (нет файла — GitHub соберёт список изменений сам).
#
# Секреты репозитория для подписи APK (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  — base64 от keystore/release.jks
#   ANDROID_KEYSTORE_PROPERTIES — содержимое keystore/keystore.properties
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PROPS: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KS" ] && [ -n "$PROPS" ]; then
            mkdir -p keystore
            echo "$KS" | base64 -d > keystore/release.jks
            printf '%s\n' "$PROPS" > keystore/keystore.properties
          else
            echo "::warning::Секреты ANDROID_KEYSTORE_* не заданы — APK будет без подписи и не установится на телефон."
          fi
      - name: Build
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"   # 1.2.3-beta → 1.2.3: версии — только числа
          ./gradlew assembleRelease -PappVersion="$V" -PupdateRepo="$GITHUB_REPOSITORY"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          case "$APK" in
            *unsigned*) cp "$APK" "Stranitsa-$V-unsigned.apk" ;;
            *)          cp "$APK" "Stranitsa-$V.apk" ;;
          esac
      - name: Release notes
        id: notes
        shell: bash
        run: |
          F=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; echo "generate=false" >> "$GITHUB_OUTPUT"
          else echo "path=" >> "$GITHUB_OUTPUT"; echo "generate=true" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Страница ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: Stranitsa-*.apk

  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"; V="${V%%-*}"   # установщики принимают только числовую версию
          ./gradlew packageDistributionForCurrentOS -PappVersion="$V" -PupdateRepo="$GITHUB_REPOSITORY"
      - name: Release notes
        id: notes
        shell: bash
        run: |
          F=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$F" ]; then echo "path=$F" >> "$GITHUB_OUTPUT"; echo "generate=false" >> "$GITHUB_OUTPUT"
          else echo "path=" >> "$GITHUB_OUTPUT"; echo "generate=true" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          name: Страница ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate }}
          files: |
            desktop/build/compose/binaries/main/*/*.deb
            desktop/build/compose/binaries/main/*/*.rpm
            desktop/build/compose/binaries/main/*/*.msi
            desktop/build/compose/binaries/main/*/*.exe
            desktop/build/compose/binaries/main/*/*.dmg
          fail_on_unmatched_files: false
